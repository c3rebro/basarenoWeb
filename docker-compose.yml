services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basarenoweb-web
    environment:
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
    depends_on:
      - db
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: basarenoweb-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-basareno_root}
      MARIADB_DATABASE: ${DB_NAME:-basareno}
      MARIADB_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
